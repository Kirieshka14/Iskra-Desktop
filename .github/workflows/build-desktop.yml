name: Build Desktop Clients

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Iskra-Desktop
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debian Package and Standalone App
        run: |
          chmod +x ./gradlew
          ./gradlew packageDeb createDistributable --no-daemon

      - name: Package Standalone Tarball and AppImage
        run: |
          # 1. Portable tar.gz
          tar -czf Iskra-Linux-x86_64.tar.gz -C build/compose/binaries/main/app iskra

          # 2. Build AppImage
          mkdir -p AppDir/usr
          cp -r build/compose/binaries/main/app/iskra/* AppDir/usr/
          cat << 'EOF' > AppDir/AppRun
#!/bin/sh
SELF=$(readlink -f "$0")
HERE=${SELF%/*}
exec "$HERE/usr/bin/iskra" "$@"
EOF
          chmod +x AppDir/AppRun
          cat << 'EOF' > AppDir/iskra.desktop
[Desktop Entry]
Name=Iskra
Exec=AppRun
Icon=iskra
Type=Application
Categories=Network;
EOF
          cp icons/icon.png AppDir/iskra.png
          cp icons/icon.png AppDir/.DirIcon
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir Iskra-Linux-x86_64.AppImage || true

      - name: Publish Linux Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            build/compose/binaries/main/deb/*.deb
            Iskra-Linux-x86_64.AppImage
            Iskra-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout Iskra-Desktop
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build MSI and EXE Installers
        run: |
          .\gradlew.bat packageMsi packageExe --no-daemon

      - name: Publish Windows Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Package
    runs-on: macos-14
    steps:
      - name: Checkout Iskra-Desktop
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build DMG Package
        run: |
          chmod +x ./gradlew
          ./gradlew packageDmg --no-daemon

      - name: Publish macOS Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            build/compose/binaries/main/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
