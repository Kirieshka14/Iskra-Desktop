name: Build Desktop Clients

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            task: packageDmg
            artifact_name: desktop-macos
          - os: windows-latest
            task: packageMsi
            artifact_name: desktop-windows
          - os: ubuntu-latest
            task: packageDeb
            artifact_name: desktop-linux

    steps:
      - name: Checkout Iskra-Desktop
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Native Package
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.task }} --no-daemon

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/compose/binaries/main/dmg/*.dmg
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/deb/*.deb
          if-no-files-found: warn

  publish-release:
    name: Publish Desktop Release Assets
    needs: [build-desktop]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && !cancelled()
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            release-assets/*.dmg
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
