name: Build Desktop Clients (macOS DMG, Windows EXE, Linux DEB)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: 💻 Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: mac
            artifact_name: desktop-macos
          - os: windows-latest
            platform: win
            artifact_name: desktop-windows
          - os: ubuntu-latest
            platform: linux
            artifact_name: desktop-linux

    steps:
      - name: Checkout Iskra-Desktop
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build macOS (DMG & ZIP)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg zip --publish never

      - name: Build Windows (EXE Installer)
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --publish never

      - name: Build Linux (DEB & AppImage)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux deb AppImage --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: warn

  publish-release:
    name: 🚀 Publish All Desktop Release Assets
    needs: [build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
